[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
# sqlx 0.8 pins libsqlite3-sys 0.30.1. The patched release is 0.39, which
# that pin cannot take. The bundled copy is what Windows and macOS CI link.
# The gateway creates its own database and does not open WAL mode, which is
# the condition in RUSTSEC-2026-0459. Drop this ignore when sqlx moves up.
ignore = ["RUSTSEC-2026-0459"]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "ISC",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
