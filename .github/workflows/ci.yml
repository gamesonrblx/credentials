name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace --locked

  test-postgres:
    name: test (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: credentials
          POSTGRES_PASSWORD: credentials
          POSTGRES_DB: credentials
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credentials -d credentials"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test -p credentials-gateway --locked --test durable -- --test-threads=1
        env:
          CREDENTIALS_TEST_POSTGRES: postgres://credentials:credentials@localhost:5432/credentials?sslmode=disable

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: credentials
          POSTGRES_PASSWORD: credentials
          POSTGRES_DB: credentials
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credentials -d credentials"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: kms
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start MinIO and Vault
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin cgr.dev/chainguard/minio:latest server /data
          docker run -d --name vault --cap-add IPC_LOCK -p 8200:8200 -e VAULT_DEV_ROOT_TOKEN_ID=root -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 hashicorp/vault:1.18 server -dev
      - name: Start Dex
        run: |
          cat > "$RUNNER_TEMP/dex.yaml" << 'EOF'
          issuer: http://127.0.0.1:5556/dex
          storage:
            type: memory
          web:
            http: 0.0.0.0:5556
          oauth2:
            skipApprovalScreen: true
          staticClients:
          - id: credentials
            redirectURIs:
            - http://127.0.0.1:8080/v1/login/callback
            name: Credentials
            secret: secret
          enablePasswordDB: true
          staticPasswords:
          - email: admin@example.com
            hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
            username: admin
            userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
          EOF
          docker run -d --name dex --network host -v "$RUNNER_TEMP/dex.yaml:/etc/dex/config.yaml:ro" dexidp/dex:v2.41.1 dex serve /etc/dex/config.yaml
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4566/_localstack/health && curl -sf http://127.0.0.1:8200/v1/sys/health && curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 2
          done
      - name: Container integration tests
        run: cargo test -p credentials-edge --locked --test live --test fixtures -- --test-threads=1
        env:
          CREDENTIALS_INTEGRATION: "1"
          CREDENTIALS_TEST_KMS: http://127.0.0.1:4566
          CREDENTIALS_TEST_MINIO: http://127.0.0.1:9000
          CREDENTIALS_TEST_VAULT: http://127.0.0.1:8200
          CREDENTIALS_TEST_DEX: http://127.0.0.1:5556/dex
          CREDENTIALS_TEST_POSTGRES: postgres://credentials:credentials@localhost:5432/credentials?sslmode=disable

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
