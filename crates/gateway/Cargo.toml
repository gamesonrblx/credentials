[package]
name = "credentials-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Credentials gateway: tokens, injection, and the audit log"

[[bin]]
name = "credentials-gateway"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
credentials-crypto = { path = "../crypto" }
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
libsqlite3-sys = { version = "0.30.1", features = ["bundled"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "uuid", "migrate", "macros", "json"] }
subtle = "2.6.1"
thiserror = "2.0.21"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls = "0.26"
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v7", "std", "serde"] }
zeroize = { version = "1.9.1", features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["user"] }

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
