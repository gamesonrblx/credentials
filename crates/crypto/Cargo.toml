[package]
name = "credentials-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Envelope encryption, key wrapping, and the dev KMS for Credentials"

[dependencies]
aes-gcm = "0.11.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
uuid = { version = "1.26.1", features = ["v7", "std", "serde"] }
x-wing = { version = "0.1.1", features = ["getrandom", "zeroize"] }
zeroize = { version = "1.9.1", features = ["alloc"] }
