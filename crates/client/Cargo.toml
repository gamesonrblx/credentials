[package]
name = "credentials-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "HTTP client for the Credentials gateway"

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
webpki-roots = "1.0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v7", "std", "serde"] }

[dev-dependencies]
credentials-crypto = { path = "../crypto" }
credentials-gateway = { path = "../gateway" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
