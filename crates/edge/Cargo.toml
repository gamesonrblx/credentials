[package]
name = "credentials-edge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Customer-side and operator adapters that do not let the hosted control plane decrypt"

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
credentials-crypto = { path = "../crypto" }
p256 = { version = "0.14", features = ["ecdsa"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "time", "io-util"] }
uuid = { version = "1.26.1", features = ["v7"] }
zeroize = "1.9"

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
rcgen = "0.14"
